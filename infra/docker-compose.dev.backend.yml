# Backend server only — DEVELOPMENT (Postgres, Redis, API).
# Production equivalent: docker-compose.prod.backend.yml + ./infra/up-prod-backend.sh
#
# Usage (from repo root):
#   ./infra/up-dev-backend.sh up -d --build api
#
# Routine deploy uses Docker layer cache. Use build --no-cache only when troubleshooting.
# If disk is low: ./infra/clean-dev-cache.sh
# Env: infra/.env.be.dev or infra/.env (DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET, CORS_ORIGIN, …).
# Document files: bind mount STORAGE_HOST_PATH → /app/storage (see STORAGE_ROOT_PATH).
# Project name isolates volumes from prod on the same host.
#
# Database: default is local Docker Postgres. To use ApsaraDB, set DATABASE_URL (see
# docs/MIGRATE-TO-APSARA-DB.md). After cutover, start only redis+api (`up -d redis api`);
# a bare `up -d` starts the local postgres service again.

name: slms-dev-backend

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-slms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-slms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slms} -d ${DB_NAME:-slms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-slms}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-slms}?schema=public}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USER:-slms}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME:-slms}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh-secret-change-in-production}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-admin-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      STORAGE_ROOT_PATH: ${STORAGE_ROOT_PATH:-/app/storage}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-"false"}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      WEB_URL: ${WEB_URL:-${CORS_ORIGIN:-}}
      APP_BASE_URL: ${APP_BASE_URL:-${WEB_URL:-${CORS_ORIGIN:-}}}
      FRONTEND_URL: ${FRONTEND_URL:-${WEB_URL:-${CORS_ORIGIN:-}}}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - ${STORAGE_HOST_PATH:-./data/storage}:/app/storage:rw
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  postgres_data:
  redis_data:
