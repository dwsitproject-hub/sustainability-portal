# Production — SINGLE SERVER (Postgres, Redis, API, Web on one host).
# Usage: docker compose --env-file infra/.env -f infra/docker-compose.prod.yml up -d
#
# Split servers (same pattern as dev):
#   Backend:  docker-compose.prod.backend.yml + ./infra/up-prod-backend.sh
#   Frontend: docker-compose.prod.frontend.yml + ./infra/up-prod-frontend.sh
# Ports: DB 5000, Web 8000, API 8001.
#
# Required in infra/.env (see infra/env.example):
#   DB_USER, DB_PASSWORD, DB_NAME, REDIS_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, JWT_ADMIN_SECRET
#   API_URL (public URL for API), CORS_ORIGIN, STORAGE_HOST_PATH
# Optional: CMS_URL, SMTP_*, WEB_URL, API_PUBLIC_BASE_URL, COOKIE_DOMAIN
# External DB: set DATABASE_URL for ApsaraDB (docs/MIGRATE-TO-APSARA-DB.md). After cutover
# use `up -d redis api web` so local postgres is not started again.

name: slms-prod-all

services:
  postgres:
    image: postgres:16
    container_name: slms-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-slms}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-slms}
    ports:
      - "5000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slms} -d ${DB_NAME:-slms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7
    container_name: slms-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: slms-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api/v1
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-slms}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-slms}?schema=public}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STORAGE_ROOT_PATH: ${STORAGE_ROOT_PATH:-/app/storage}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-"false"}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      WEB_URL: ${WEB_URL:-${CORS_ORIGIN:-}}
      APP_BASE_URL: ${APP_BASE_URL:-${WEB_URL:-${CORS_ORIGIN:-}}}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      REGISTRATION_DOMAIN_RESTRICTION_ENABLED: ${REGISTRATION_DOMAIN_RESTRICTION_ENABLED:-true}
      FRONTEND_URL: ${FRONTEND_URL:-${WEB_URL:-${CORS_ORIGIN:-}}}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      # Set SESSION_COOKIE_SECURE=false in .env when running over plain HTTP (e.g. staging without TLS).
      # Browsers silently reject Secure cookies on HTTP origins, breaking SSO session delivery.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ports:
      - "8001:3001"
    volumes:
      - ${STORAGE_HOST_PATH:-./data/storage}:/app/storage:rw
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        API_BACKEND_URL: http://api:3001
    container_name: slms-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_CMS_URL: ${CMS_URL:-}
      API_BACKEND_URL: http://api:3001
      SLMS_DOCKER_WEB: "true"
    ports:
      - "8000:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
